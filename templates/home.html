{% extends "base.html" %}
{% block content %}
<h1>Accueil VetTime</h1>
<p>Connecté (user_id={{ request.session.get("user_id") }}).</p>
<form method="post" action="/logout">
  <input type="hidden" name="csrf_token" value="{{ request.session.get('csrf_token') }}">
  <button type="submit">Se déconnecter</button>
</form>

<form method="post" action="/pointe">
  <button type="submit">Pointer (entrée/sortie)</button>
</form>
<p><a href="/poincons">Voir l'historique des poinçons</a>
<p><a href="/horaire">Voir mon horaire et heures cumulees</a></p></p>

{% endblock %}
