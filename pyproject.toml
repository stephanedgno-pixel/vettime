[project]
name = "vettime"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "psycopg2-binary>=2.9",
    "httpx>=0.27",
    "sqlalchemy>=2.1.8",
    "python-dotenv>=1.2.4",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt==4.0.1",
    "jinja2>=3.1.6",
    "python-multipart>=0.0.34",
]

[project.optional-dependencies]
dev = ["pytest>=8.3"]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.5",
]

[tool.ruff.lint]
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
